
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Compensação – SENAI CETIQT</title>

<style>
:root {
    --primary: #1e40af;
    --primary-dark: #1e3a8a;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #22c55e;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #e0e7ff, #f8fafc);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    background: var(--card);
    width: 390px;
    max-width: 100%;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.12);
    position: relative;
}

.badge {
    position: absolute;
    top: 14px;
    right: 16px;
    background: #e0e7ff;
    color: var(--primary-dark);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
}

.header {
    text-align: center;
    margin-bottom: 22px;
}

.header .brand {
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 1px;
}

.header h1 {
    font-size: 18px;
    margin: 6px 0 0;
    color: var(--text);
}

.header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
}

.field {
    margin-bottom: 14px;
}

label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
}

input {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(30,64,175,0.15);
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #e5e7eb;
    color: #111827;
}

.btn-secondary:hover {
    background: #d1d5db;
}

.result {
    margin-top: 18px;
    padding: 16px;
    border-radius: 14px;
    background: #f8fafc;
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.8;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.highlight {
    color: var(--primary-dark);
    font-weight: 600;
}

.success {
    background: #ecfdf5;
    border-color: #34d399;
    color: #065f46;
}

.footer {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
}

</style>
</head>

<body>

<div class="card">

    <div class="badge">Uso interno • SENAI CETIQT</div>

    <div class="header">
        <div class="brand">SENAI – CETIQT</div>
        <h1>Compensação de Horas</h1>
        <p>Base anual oficial</p>
    </div>

    <div class="field">
        <label for="totalHoras">Total de horas a compensar</label>
        <input
            type="number"
            id="totalHoras"
            placeholder="Ex: 64"
            min="0"
            step="0.01"
        >
    </div>

    <div class="actions">
        <button class="btn-primary" onclick="calcular()">
            Calcular
        </button>

        <button class="btn-secondary" onclick="limpar()">
            Limpar
        </button>
    </div>

    <div id="resultado"></div>

    <div class="footer">
        Em caso de dúvidas:<br>
        <strong>MDRConceicao@cetiqt.senai.br</strong>
    </div>

</div>

<script>

const TOTAL_DIAS_UTEIS = 233;

const feriados = [
  "2026-01-01","2026-01-02","2026-01-19","2026-01-20",
  "2026-02-13","2026-02-16","2026-02-17","2026-02-18",
  "2026-04-03","2026-04-20","2026-04-21","2026-04-23",
  "2026-05-01",
  "2026-06-04","2026-06-05",
  "2026-09-07",
  "2026-10-12",
  "2026-11-02","2026-11-20",
  "2026-12-21","2026-12-22","2026-12-23","2026-12-24",
  "2026-12-25","2026-12-28","2026-12-29","2026-12-30","2026-12-31"
];

function isDiaUtil(data) {
    const dia = data.getDay();

    const ano = data.getFullYear();
    const mes = String(data.getMonth() + 1).padStart(2, "0");
    const diaMes = String(data.getDate()).padStart(2, "0");

    const iso = `${ano}-${mes}-${diaMes}`;

    return dia !== 0 && dia !== 6 && !feriados.includes(iso);
}

function diasUteisRestantesHoje() {

    let data = new Date(2026, 0, 1);
    const hoje = new Date();

    hoje.setHours(0, 0, 0, 0);

    let usados = 0;

    while (data < hoje) {

        if (isDiaUtil(data)) {
            usados++;
        }

        data.setDate(data.getDate() + 1);
    }

    return Math.max(0, TOTAL_DIAS_UTEIS - usados);
}

function calcular() {

    const totalHoras = Number(
        document.getElementById("totalHoras").value
    );

    const resultado = document.getElementById("resultado");

    if (
        document.getElementById("totalHoras").value === "" ||
        !Number.isFinite(totalHoras) ||
        totalHoras <= 0
    ) {
        resultado.innerHTML = `
            <div class="result">
                ⚠️ Informe uma quantidade válida de horas a compensar.
            </div>
        `;
        return;
    }

    const diasUteis = diasUteisRestantesHoje();

    const totalMinutos = Math.round(totalHoras * 60);

    const horas = Math.floor(totalMinutos / 60);
    const minutos = totalMinutos % 60;

    if (diasUteis === 0) {
        resultado.innerHTML = `
            <div class="result">
                ⚠️ Não há mais dias úteis disponíveis na base anual de 2026.
            </div>
        `;
        return;
    }

    const mediaDiaria = Math.ceil(totalMinutos / diasUteis);

    const hMedia = Math.floor(mediaDiaria / 60);
    const mMedia = mediaDiaria % 60;

    resultado.innerHTML = `
        <div class="result">

            <div>
                <strong>Dias úteis restantes:</strong>
                <span class="highlight">${diasUteis}</span>
            </div>

            <div>
                <strong>Total a compensar:</strong>
                <span class="highlight">${horas}h ${minutos}min</span>
            </div>

            <div>
                <strong>Média diária necessária:</strong>
                <span class="highlight">${hMedia}h ${mMedia}min</span>
            </div>

        </div>
    `;
}

function limpar() {

    document.getElementById("totalHoras").value = "";

    document.getElementById("resultado").innerHTML = "";

}

</script>

</body>
</html>
